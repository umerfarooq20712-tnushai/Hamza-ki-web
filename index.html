<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b14">
<title>SECURE_SHELL | Access Card Generator</title>

<style>
:root {
  --bg: #070b14;
  --cyan: #45e5ff;
  --green: #65ffb0;
  --muted: #8296ab;
  --border: #29445c;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 22px 15px;
  background:
    radial-gradient(ellipse at top, #102b42, transparent 65%),
    var(--bg);
  color: #d9f7ff;
  font-family: "Courier New", monospace;
}

.app {
  max-width: 540px;
  width: 100%;
  margin: auto;
}

header {
  text-align: center;
  margin: 16px 0 28px;
}

h1 {
  margin: 0;
  font-size: clamp(28px, 7vw, 40px);
  letter-spacing: 2px;
  color: var(--cyan);
  text-shadow: 0 0 18px #45e5ff50;
  overflow-wrap: anywhere;
}

.subtitle {
  color: var(--muted);
  font-size: 10px;
  line-height: 1.9;
  letter-spacing: 1.2px;
  margin-top: 12px;
}

.status {
  display: inline-block;
  margin-top: 15px;
  padding: 8px 12px;
  border: 1px solid #65ffb044;
  border-radius: 30px;
  color: var(--green);
  font-size: 10px;
}

.panel {
  background: #0b1422ed;
  border: 1px solid #45e5ff36;
  border-radius: 13px;
  padding: 20px;
  box-shadow: 0 0 30px #45e5ff09;
}

.window {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 15px;
  border-bottom: 1px solid #ffffff15;
  color: var(--muted);
  font-size: 10px;
}

.lights {
  display: flex;
  gap: 6px;
}

.light {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

.red { background: #ff5b65; }
.yellow { background: #ffca51; }
.green { background: #55ed8c; }

.terminal {
  margin: 20px 0;
  color: var(--green);
  font-size: 12px;
  line-height: 2;
}

.section-label {
  display: block;
  color: var(--cyan);
  font-size: 11px;
  margin: 22px 0 12px;
}

.input-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: #050b14;
}

.prompt {
  color: var(--green);
  font-size: 17px;
}

input {
  width: 100%;
  min-width: 0;
  padding: 15px 0;
  color: var(--cyan);
  background: transparent;
  border: 0;
  outline: none;
  font: 14px "Courier New", monospace;
}

input::placeholder { color: #718398; }

.input-wrap:focus-within {
  border-color: var(--cyan);
  box-shadow: 0 0 12px #45e5ff15;
}

button {
  width: 100%;
  margin-top: 16px;
  padding: 16px 12px;
  border: 1px solid var(--cyan);
  border-radius: 8px;
  background: var(--cyan);
  color: #04111a;
  font: bold 12px "Courier New", monospace;
  letter-spacing: 1.2px;
  cursor: pointer;
}

button:active {
  background: #91efff;
}

button:focus-visible {
  outline: 2px solid white;
  outline-offset: 3px;
}

footer {
  margin: 25px 0 10px;
  color: #53677c;
  text-align: center;
  font-size: 10px;
  line-height: 2;
}

@media (max-width: 360px) {
  body { padding: 16px 10px; }
  .panel { padding: 15px; }
}
</style>
</head>

<body>
<main class="app">

  <header>
    <h1>SECURE_SHELL</h1>
    <div class="subtitle">
      PERSONAL ACCESS CARD SYSTEM // V5.1
    </div>
    <div class="status">● SYSTEM ONLINE</div>
  </header>

  <section class="panel">
    <div class="window">
      <div class="lights">
        <span class="light red"></span>
        <span class="light yellow"></span>
        <span class="light green"></span>
      </div>
      <span>TERMINAL // READY</span>
    </div>

    <div class="terminal">
      [SYSTEM] Card rendering engine initialized.<br>
      [READY] Enter text to create your access card.
    </div>

    <form id="card-form">
      <label class="section-label" for="passkey">
        // ACCESS PASSKEY
      </label>

      <div class="input-wrap">
        <span class="prompt">&gt;</span>
        <input
          id="passkey"
          type="text"
          name="access-card-content"
          placeholder="Write your mobile passkey"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          maxlength="500"
          required
        >
      </div>

      <button id="generate" type="submit">
        GENERATE CARD
      </button>
    </form>
  </section>

  <footer>
    SECURE_SHELL V5.1<br>
    PERSONAL ACCESS CARD SYSTEM
  </footer>

</main>

<script>
(() => {
  "use strict";

  const form = document.getElementById("card-form");
  const input = document.getElementById("passkey");

  function makeTimestamp(date) {
    const pad = n => String(n).padStart(2, "0");

    return date.getFullYear() + "-" +
      pad(date.getMonth() + 1) + "-" +
      pad(date.getDate()) + " " +
      pad(date.getHours()) + ":" +
      pad(date.getMinutes()) + ":" +
      pad(date.getSeconds());
  }

  function wrapText(ctx, text, maxWidth) {
    const lines = [];

    for (const paragraph of text.split(/\r?\n/)) {
      if (!paragraph) {
        lines.push("");
        continue;
      }

      let line = "";

      for (const word of paragraph.split(/\s+/)) {
        let remaining = word;

        while (ctx.measureText(remaining).width > maxWidth) {
          let part = "";

          for (const character of remaining) {
            if (ctx.measureText(part + character).width > maxWidth) break;
            part += character;
          }

          if (!part) break;

          if (line) {
            lines.push(line);
            line = "";
          }

          lines.push(part);
          remaining = remaining.slice(part.length);
        }

        if (!remaining) continue;

        const candidate = line ? line + " " + remaining : remaining;

        if (ctx.measureText(candidate).width > maxWidth && line) {
          lines.push(line);
          line = remaining;
        } else {
          line = candidate;
        }
      }

      if (line) lines.push(line);
    }

    return lines;
  }

  function createCard(text, date) {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    if (!ctx) {
      throw new Error("Canvas is not supported.");
    }

    const width = 1000;
    const padding = 58;
    const maxTextWidth = width - padding * 2 - 42;
    const lineHeight = 40;

    ctx.font = "bold 27px monospace";

    const lines = wrapText(ctx, text, maxTextWidth);

    const contentTop = 185;
    const contentPaddingTop = 76;

    const contentHeight = Math.max(
      180,
      contentPaddingTop + lines.length * lineHeight + 30
    );

    canvas.width = width;
    canvas.height = contentTop + contentHeight + 100;

    const height = canvas.height;

    const gradient = ctx.createLinearGradient(0, 0, width, height);
    gradient.addColorStop(0, "#10243b");
    gradient.addColorStop(1, "#030811");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);

    ctx.strokeStyle = "#45e5ff0b";
    ctx.lineWidth = 1;

    for (let x = 0; x < width; x += 35) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, height);
      ctx.stroke();
    }

    for (let y = 0; y < height; y += 35) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(width, y);
      ctx.stroke();
    }

    ctx.strokeStyle = "#45e5ff";
    ctx.lineWidth = 3;
    ctx.strokeRect(18, 18, width - 36, height - 36);

    ctx.fillStyle = "#142a42";
    ctx.fillRect(32, 32, width - 64, 100);

    const colors = ["#ff5b65", "#ffca51", "#55ed8c"];
    colors.forEach((color, index) => {
      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.arc(60 + index * 26, 62, 7, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.fillStyle = "#45e5ff";
    ctx.font = "bold 30px monospace";
    ctx.fillText("SECURE_SHELL", 155, 70);

    ctx.fillStyle = "#9cb1c5";
    ctx.font = "16px monospace";
    ctx.fillText("PERSONAL ACCESS RECORD", 155, 100);

    ctx.fillStyle = "#9cb1c5";
    ctx.font = "17px monospace";
    ctx.fillText("CREATED: " + makeTimestamp(date), padding, 163);

    ctx.fillStyle = "#040a13";
    ctx.fillRect(padding, contentTop, width - padding * 2, contentHeight);

    ctx.strokeStyle = "#28455c";
    ctx.lineWidth = 2;
    ctx.strokeRect(padding, contentTop, width - padding * 2, contentHeight);

    ctx.fillStyle = "#7e95ab";
    ctx.font = "16px monospace";
    ctx.fillText("ACCESS CONTENT", padding + 22, contentTop + 35);

    ctx.fillStyle = "#45e5ff";
    ctx.font = "bold 27px monospace";

    lines.forEach((line, index) => {
      ctx.fillText(line, padding + 22, contentTop + contentPaddingTop + index * lineHeight);
    });

    ctx.fillStyle = "#65ffb0";
    ctx.font = "16px monospace";
    ctx.fillText("SECURE_SHELL // ACCESS RECORD", padding, height - 64);

    ctx.fillStyle = "#8ba0b5";
    ctx.font = "13px monospace";
    ctx.fillText("PERSONAL ACCESS CARD", padding, height - 40);

    return canvas;
  }

  function buildFileName() {
    const now = new Date();
    return "SecureShell_AccessCard_" +
      now.getFullYear() +
      String(now.getMonth() + 1).padStart(2, "0") +
      String(now.getDate()).padStart(2, "0") + "_" +
      String(now.getHours()).padStart(2, "0") +
      String(now.getMinutes()).padStart(2, "0") +
      String(now.getSeconds()).padStart(2, "0") +
      ".png";
  }

  async function saveFileViaPicker(blob, fileName) {
    if (!("showSaveFilePicker" in window)) {
      return false;
    }

    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: fileName,
        types: [{
          description: "PNG Image",
          accept: { "image/png": [".png"] }
        }]
      });

      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return true;
    } catch (error) {
      if (error && error.name === "AbortError") {
        return true;
      }
      throw error;
    }
  }

  function downloadCanvas(canvas) {
    return new Promise((resolve, reject) => {
      canvas.toBlob(async blob => {
        if (!blob) {
          reject(new Error("PNG generation failed."));
          return;
        }

        const fileName = buildFileName();

        try {
          const picked = await saveFileViaPicker(blob, fileName);
          if (picked) {
            resolve();
            return;
          }

          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = fileName;
          anchor.style.display = "none";

          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();

          setTimeout(() => {
            URL.revokeObjectURL(url);
            resolve();
          }, 2000);
        } catch (error) {
          console.error("Card generation failed:", error);
          reject(error);
        }
      }, "image/png");
    });
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();

    const text = input.value.trim();

    if (!text) {
      input.focus();
      return;
    }

    try {
      const canvas = createCard(text, new Date());
      await downloadCanvas(canvas);
    } catch (error) {
      console.error("Card generation failed:", error);
      alert("Unable to generate the card. Please try again.");
    }
  });
})();
</script>
</body>
</html>
